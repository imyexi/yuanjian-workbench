const NAV=[['research','search','关键词洞察'],['products','box','电商盯盘'],['report','report','报告与选品']];

const primaryPage=page=>['research','keywords','posts','insights'].includes(page)?'research':page;
function routePage(page){if(page==='posts'){quick.tab='posts';return 'research'}return ROUTE_LABELS[page]?page:'research'}
const state={project:null,projects:[],page:'overview',query:'',filter:'all',sort:'default',selected:new Set(),reportTab:'decision',marketingId:'',evidenceIds:null,busy:false,modal:null};
let toastTimer,projectLoadSequence=0;
function toast(text){document.querySelector('#toast-root').innerHTML=`<div class="toast" role="status">${esc(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast-root').innerHTML='',4200)}
async function api(path,body){const res=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const value=await res.json();if(!res.ok){const error=Error(value.error||'请求失败');error.status=res.status;throw error}return value}
async function mutate(action,body={}){if(state.busy)return;state.busy=true;document.querySelector('#save-status').textContent='正在保存…';try{state.project=await api(`/api/projects/${state.project.id}/${action}`,{revision:state.project.revision,...body});render();return state.project}finally{state.busy=false;document.querySelector('#save-status').textContent=state.project?`已保存 ${date(state.project.updated_at)}`:'尚未保存'}}
async function openProject(id){const sequence=++projectLoadSequence,project=await api('/api/projects/'+id);if(sequence!==projectLoadSequence)return false;state.project=project;syncQuickProject();state.selected.clear();state.evidenceIds=null;state.query='';state.filter='all';state.marketingId='';location.hash=`${state.page}?project=${id}`;render();await resumeCollection();if(sequence!==projectLoadSequence||state.project?.id!==id)return false;await resumeAI();if(sequence!==projectLoadSequence||state.project?.id!==id)return false;if(typeof recommendationsOnNavigation==='function')recommendationsOnNavigation({afterAI:true});setTimeout(checkDeviceSetup,1200);return true}
function goto(page,query=''){state.page=routePage(page);state.query=query;state.filter='all';state.sort='default';state.selected.clear();window.scrollTo(0,0);location.hash=state.page+(state.project?'?project='+state.project.id:'');render();if(typeof recommendationsOnNavigation==='function')recommendationsOnNavigation()}
function latest(){return state.project?.analyses.at(-1)}
function stale(){return latest()&&latest().data_version!==state.project.data_version}
function head(title,description,buttons=''){return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="actions">${buttons}</div></div>`}
function demoNote(){return state.project?.demo?`<div class="source-note">${icon('info')}<span>演示项目 · 商品、关键词与评论均为虚构样本，仅用于体验流程，不代表真实市场数据。</span></div>`:''}
function staleNote(){return stale()?`<div class="source-note">${icon('refresh')}<span>项目数据已更新，当前显示的是旧版整理结果。</span><button class="text-button" data-action="analyze">重新整理</button></div>`:''}
function empty(title,body,button='',ico='search'){return `<div class="empty">${icon(ico)}<h3>${title}</h3><p>${body}</p>${button}</div>`}
function button(text,action,ico='',style='',extra=''){return `<button class="btn ${style}" data-action="${action}" ${extra}>${ico?icon(ico):''}${text}</button>`}
function projectList(){return state.projects.length?`<div class="project-list">${state.projects.map(p=>`<button class="project-row" data-action="open" data-id="${esc(p.id)}"><span class="project-symbol">${icon('box')}</span><span class="grow"><strong>${esc(p.name)}</strong> ${p.demo?badge('演示','amber'):''}<p>${p.error?esc(p.error):`${esc(p.keyword||'尚未设置关键词')} · 美国 / Amazon`}</p></span><span class="meta">${p.counts?`${p.counts.products} 件商品 · ${p.counts.reviews} 条评论`:''}<br>${date(p.updated_at)}</span>${icon('chevron')}</button>`).join('')}</div>`:empty('还没有调研项目','新建项目导入自己的数据，或打开演示项目体验完整流程。','', 'grid')}
function overview(){const p=state.project;if(!p)return `<div class="intro"><div><div class="eyebrow">YOUR NEXT OPPORTUNITY</div><h1>从一个产品方向，<br>到有依据的选择。</h1><p>把搜索词、竞品和用户评价放在一起。找到值得验证的需求，也看清每一个判断的依据。</p><div class="actions">${button('新建调研项目','new','', 'primary')}${button('体验完整流程','demo','arrow')}</div><p class="caption">本地保存 · 随时接续 · 数据来源清晰可查</p></div><div class="intro-steps">${[['收集需求与商品','从关键词开始，整理商品和对应评论。'],['让判断回到证据','并排比较候选，点开结论查看评论原文。'],['带着明确的问题前进','形成选品观察与营销草稿，保存或导出报告。']].map((x,i)=>`<div class="intro-step"><span class="step-no">0${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div></div><div class="section-head"><h2>最近项目</h2>${button('恢复项目文件','restore','upload','small')}</div>${projectList()}`;
 const counts=[p.keywords.length,p.products.length,p.reviews.length,p.products.filter(x=>x.candidate).length];
 return head(esc(p.name),'从需求线索到候选判断，沿着同一份证据继续。',button('项目设置','rename','','')+button('导出项目','export-project','download',''))+demoNote()+`<div class="progress-strip">${[['关键词',counts[0],'条'],['已收集内容',(p.posts||[]).length,'条'],['评论样本',counts[2],'条'],['候选清单',counts[3],'件']].map(([label,n,u])=>`<div><div class="number">${n}<small>${u}</small></div><div class="stat-label">${label}</div></div>`).join('')}</div><div class="workflow">${[['keywords','关键词',counts[0]],['posts','内容与评论',(p.posts||[]).length],['products','商品比较',counts[1]],['insights','用户需求',p.analyses.length],['report','选品与营销',p.analyses.length]].map(([page,label,n],i)=>`<button class="${n?'done':''}" data-action="navigate" data-page="${page}"><span>0${i+1} &nbsp; ${label}</span><small>${n?'已有内容，继续查看':'等待开始'}</small></button>`).join('')}</div><div class="two-col"><section class="flat-section"><h2>继续这次调研</h2><div class="next-action"><h3>${counts[2]?'从评论中整理用户需求':counts[1]?'为候选商品补充评论':'从关键词搜索相关讨论'}</h3><p>${counts[2]?'查看本次样本中的清洁、携带与续航等线索，保留原文依据。':counts[1]?'先选中值得关注的商品，再导入对应评论，避免丢失商品关联。':'在「内容与评论」按关键词搜索，选择相关帖子后采集评论。'}</p>${button(counts[2]?'查看用户需求':counts[1]?'查看商品清单':'搜索相关内容','navigate','arrow','primary',`data-page="${counts[2]?'insights':counts[1]?'products':'posts'}"`)}</div><div class="section-head"><h3>候选方向</h3><button class="text-button" data-action="navigate" data-page="products">查看全部 →</button></div>${p.products.filter(x=>x.candidate).slice(0,3).map(x=>`<div class="activity"><span>${icon('box')}</span><div><strong>${esc(x.title)}</strong><p>${money(x)} · ${x.features.map(esc).join(' / ')||'特点待补充'}</p></div></div>`).join('')||'<p class="muted">在商品页将商品加入候选清单。</p>'}</section><section class="flat-section"><h2>项目记录</h2><div class="activity">${icon('clock')}<div><strong>已保存到项目文件</strong><p>${date(p.updated_at)} · 版本 ${p.revision}</p></div></div>${p.runs.slice(-3).reverse().map(r=>`<div class="activity">${icon(r.errors.length?'info':'upload')}<div><strong>${{keywords:'关键词',products:'商品',posts:'内容',reviews:'评论'}[r.kind]}${r.mode==='collection'?'采集':'导入'}${r.status==='partial'?' · 部分成功':r.status==='failed'?' · 失败':''}</strong><p>${r.imported} 条新增 · ${r.duplicates} 条重复 · ${r.errors.length} 行失败</p><button class="text-button" data-action="run" data-id="${r.id}">查看详情</button></div></div>`).join('')}${latest()?`<div class="activity">${icon('report')}<div><strong>已生成规则整理结果 ${stale()?badge('需要更新','amber'):''}</strong><p>${date(latest().created_at)} · ${latest().scope.analyzed} 条评论样本</p></div></div>`:''}<div class="callout">${p.demo?'当前为演示项目。开始真实调研时，请新建一个项目，避免混用演示资料。':'可在「内容与评论」采集 TikTok、小红书和 Reddit 讨论，再整理需求。可生成关键词报告与千机塔营销洞察，分析由本机 Codex 完成。'}</div></section></div>`}
function keywords(){const p=state.project;let rows=p.keywords.filter(k=>(k.text+' '+k.translation).toLowerCase().includes(state.query.toLowerCase()));rows=rows.filter(k=>state.filter==='all'||state.filter==='favorite'&&k.favorite||state.filter==='problem'&&k.intent==='解决使用问题'||state.filter==='ai'&&k.data_type==='ai'||state.filter==='collected'&&k.data_type!=='ai');return head('关键词','看见用户怎样搜索，也保留使用问题里的需求线索。',button('导入关键词','import','upload','', 'data-kind="keywords"')+button('采集关键词','collect-keywords','search','primary'))+demoNote()+jobView()+`<div class="toolbar"><div class="search">${icon('search')}<input id="search-input" placeholder="搜索关键词或中文释义" value="${esc(state.query)}" aria-label="搜索关键词"></div><select id="filter-select" aria-label="筛选关键词">${[['all','全部关键词'],['collected','采集 / 导入词'],['ai','AI 建议词'],['problem','使用问题'],['favorite','已收藏']].map(([v,t])=>`<option value="${v}" ${state.filter===v?'selected':''}>${t}</option>`).join('')}</select><div class="spacer"></div>${button('导出 CSV','export-keywords','download','small')}</div>${state.selected.size?`<div class="selection-bar"><span>已选 ${state.selected.size} 个关键词</span><button class="text-button" data-action="selected-search">用所选词搜索内容 →</button></div>`:''}${rows.length?`<div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="select-all" aria-label="选择当前筛选结果" ${rows.every(k=>state.selected.has(k.id))?'checked':''}></th><th>关键词 / 中文释义</th><th>搜索意图</th><th>场景</th><th>来源与类型</th><th>操作</th></tr></thead><tbody>${rows.map(k=>`<tr><td><input type="checkbox" data-select="${esc(k.id)}" aria-label="选择 ${esc(k.text)}" ${state.selected.has(k.id)?'checked':''}></td><td><div class="kw">${esc(k.text)}</div><div class="secondary">${esc(k.translation||(k.platform==='xhs'?'原词为中文':'中文释义待补充'))}</div></td><td><span class="intent ${k.intent==='解决使用问题'?'problem':''}">${esc(k.intent)}</span></td><td class="muted">${esc(k.scene||'待归类')}</td><td>${k.data_type==='ai'?badge('AI 建议词','blue'):source(k)}<div class="secondary">${esc(k.source)} · ${date(k.collected_at)}</div></td><td><button class="icon-button ${k.favorite?'selected':''}" data-action="favorite" data-id="${esc(k.id)}" title="${k.favorite?'取消收藏':'收藏关键词'}" aria-label="${k.favorite?'取消收藏':'收藏关键词'}">${icon('star')}</button><button class="icon-button" data-action="keyword-search" data-id="${esc(k.id)}" title="搜索相关内容" aria-label="搜索相关内容">${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>显示 ${rows.length} / ${p.keywords.length} 个关键词</span><span>联想词数量不代表搜索量 · Amazon 月搜索量请在「开始调研」查看</span></div>`:empty('暂无符合条件的关键词',p.keywords.length?'调整搜索或筛选条件。':'先导入关键词文件。来源和时间将随记录一起保存。',p.keywords.length?'':button('导入关键词','import','upload','', 'data-kind="keywords"'))}`}
function art(p,large=false){return `<div class="product-art ${large?'large':''}" style="color:${['#7897a0','#b9a896','#8894b4','#9baaa1'][state.project.products.indexOf(p)%4]}">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer">`:`<svg viewBox="0 0 50 90" aria-label="${state.project.demo?'演示商品示意图':'暂无商品图片'}"><path d="M15 8h20v7H15zM12 15h26l-3 49H15l-3-49ZM15 64h20l2 16H13l2-16ZM17 83h16M18 20l1 35M23 70h5"/><path d="M18 59h14"/></svg>`}</div>`}
function products(){const p=state.project;let rows=p.products.filter(x=>(x.title+' '+x.features.join(' ')).toLowerCase().includes(state.query.toLowerCase()));if(state.filter==='candidate')rows=rows.filter(x=>x.candidate);if(state.sort==='price')rows.sort((a,b)=>(a.currency||'未知').localeCompare(b.currency||'未知')||(a.price??Infinity)-(b.price??Infinity));if(state.sort==='rating')rows.sort((a,b)=>(b.rating??-1)-(a.rating??-1));let candidates=p.products.filter(x=>x.candidate);return head('电商盯盘','按关键词发现竞品，加入关注清单，再查看价格、排名与销量估算的变化。',button('导入商品','import','upload','','data-kind="products"')+button('按关键词找竞品','query-products','search','primary'))+demoNote()+`<div class="toolbar"><div class="segmented"><button class="${state.filter==='all'?'active':''}" data-action="product-filter" data-value="all">全部商品 ${p.products.length}</button><button class="${state.filter==='candidate'?'active':''}" data-action="product-filter" data-value="candidate">关注竞品 ${candidates.length}</button></div><div class="search">${icon('search')}<input id="search-input" placeholder="筛选商品名称或特点" aria-label="筛选商品" value="${esc(state.query)}"></div><select id="sort-select" aria-label="商品排序"><option value="default">默认顺序</option><option value="price" ${state.sort==='price'?'selected':''}>同币种价格从低到高</option><option value="rating" ${state.sort==='rating'?'selected':''}>评分从高到低</option></select><div class="spacer"></div>${button('导出','export-products','download','small')}</div>${rows.length?`<div class="table-wrap"><table class="watch-products"><thead><tr><th>商品</th><th>价格</th><th>评分 / 评论数</th><th>销售表现</th><th>来源</th><th>关注与趋势</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="plain product-cell" data-action="product-detail" data-id="${esc(x.id)}">${art(x)}<span><strong>${esc(x.title)}</strong><p>${x.features.map(esc).join(' · ')}</p></span></button></td><td class="price">${money(x)}</td><td>${x.rating??'暂无数据'}<div class="secondary">${x.review_count===null?'评论总数未提供':x.review_count+' 条评论'}</div></td><td>${e async function runAction(action,el){if(typeof recommendationAction==='function'&&await recommendationAction(action,el))return;if(await watchAction(action,el))return;if(await workflowAction(action,el))return;if(await researchAction(action,el))return;if(await collectAction(action,el))return;switch(action){
case'navigate':goto(el.dataset.page);break;
case'new':modal('新建调研项目',`<div class="field"><label for="project-name">项目名称</label><input id="project-name" placeholder="例如：便携榨汁杯美国市场调研" maxlength="120"></div><div class="field"><label for="project-keyword">产品关键词</label><input id="project-keyword" placeholder="中文也可以，例如：便携榨汁杯" maxlength="300"></div><div class="form-row">${[['目标市场','美国'],['平台','Amazon'],['资料语言','英文']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}" readonly aria-label="${l}"></div>`).join('')}</div><p>选品目标为美国 Amazon；需求支持 TikTok、小红书、Reddit 采集。项目文件自动保存在本机。</p>`,button('取消','close')+button('创建项目','create','','primary'));break;
case'create':{const name=document.querySelector('#project-name').value.trim(),keyword=document.querySelector('#project-keyword').value.trim();if(!name||!keyword)throw Error('请填写项目名称与关键词');state.project=await api('/api/projects',{name,keyword});closeModal();syncQuickProject();goto('research');toast('项目已创建并保存');break}
case'demo':{const previous=(await api('/api/projects')).find(p=>p.demo);if(previous){await openProject(previous.id)}else{state.project=await api('/api/projects',{demo:true});goto('overview')}toast('已打开演示项目，全部资料均为虚构样本');break}
case'projects':state.projects=await api('/api/projects');modal('切换调研项目',projectList()+`<div style="margin-top:20px">${button('恢复项目文件','restore','upload','small')}</div>`);break;
case'open':await openProject(el.dataset.id);closeModal();break;
case'close':closeModal();break;
case'sources':modal('数据源与能力',`<p>当前版本支持本地导入与证据整理。以下连接状态如实展示，未连接的功能不会生成假数据。</p>${[['关键词与商品','拟接入 Rainforest，美国 Amazon 英文资料','未连接'],['评论正文','在线可用性待试采，支持真实评论文件导入','未连接'],['AI 翻译与分析','需要本机独立配置模型服务；当前提供规则整理','未连接'],['本地项目文件','支持版本保存、导入、导出与恢复','可使用']].map(([name,desc,status])=>`<div class="status-row"><div><h3>${name}</h3><p>${desc}</p></div>${badge(status,status==='可使用'?'green':'')}</div>`).join('')}<div class="callout">本轮先交付完整功能框架。在线采集和 AI 生成接入后才开放实际请求。凭据须在每台设备独立配置，并保存在同步目录外。</div>`,button('知道了','close','','primary'));break;
case'help':modal('开始一次有依据的调研',`<div class="intro-steps">${[['新建项目','填写产品方向；没有自己的资料时可以先体验演示项目。'],['导入关键词与商品','各页面支持下载 JSON 字段模板，也支持 CSV。不要填写不存在的指标。'],['加入候选，导入评论','评论的 product_id 必须与商品编号一致。'],['整理证据与比较','规则整理按预设词组匹配主题。点击结论可查看原文；模型能力尚未接入。'],['保存与接续','每次操作自动保存。切换设备前停止服务、等待文件同步；两台设备不要同时编辑。'],['导出结果','可下载 CSV、独立 HTML 报告、完整 JSON 项目包。恢复会新建副本。']].map(([title,desc],i)=>`<div class="intro-step"><span class="step-no">0${i+1}</span><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}</div>`,button('体验演示项目','demo','arrow','primary'));break;
case'import':importModal(el.dataset.kind);break;
case'template':download(state.importKind+'-template.json',JSON.stringify(TEMPLATES[state.importKind],null,2));toast('字段模板已下载');break;
case'perform-import':{const file=document.querySelector('#import-file').files[0];let body={kind:state.importKind};if(file){if(file.size>10_000_000)throw Error('文件超过 10 MB，请分批导入');const text=await file.text();body=file.name.toLowerCase().endsWith('.csv')?{...body,format:'csv',text}:{...body,rows:JSON.parse(text)}}else{const text=document.querySelector('#import-text').value;try{body.rows=JSON.parse(text)}catch{throw Error('请输入有效的 JSON 数组，或选择 CSV / JSON 文件')}}el.disabled=true;try{await mutate('import',body);closeModal();const r=state.project.runs.at(-1);toast(`已导入 ${r.imported} 行，跳过 ${r.duplicates} 行重复，${r.errors.length} 行失败`);if(r.errors.length)showRun(r)}finally{el.disabled=false}break}
case'favorite':await mutate('toggle',{kind:'keywords',id:el.dataset.id});break;
case'candidate':await mutate('toggle',{kind:'products',id:el.dataset.id});break;
case'keyword-search':{const k=state.project.keywords.find(k=>k.id===el.dataset.id);goto('products',k.text);toast('正在筛选已保存商品；在线查询尚未连接');break}
case'selected-search':{const k=state.project.keywords.find(k=>state.selected.has(k.id));goto('products',k?.text||'');toast('使用首个所选词筛选本地商品；在线查询尚未连接');break}
case'product-filter':state.filter=el.dataset.value;render();break;
case'export-keywords':csvExport('keywords');break;
case'export-products':csvExport('products');break;
case'product-detail':{const p=state.project.products.find(p=>p.id===el.dataset.id);modal('商品详情',`${art(p,true)}<h2 style="margin-top:22px">${esc(p.title)}</h2><p style="margin:8px 0">${money(p)} · ${source(p)}</p><p>商品编号：${esc(p.id)}</p><div class="tag-row">${p.features.map(f=>badge(f)).join('')}</div><div class="status-row"><span>评分 / 评论数</span><span>${p.rating??'暂无数据'} / ${p.review_count??'暂无数据'}</span></div><div class="status-row"><span>销售表现</span><span>${esc(p.sales_raw||'暂无数据')}<br>${esc(p.sales_period)}</span></div><div class="status-row"><span>来源</span><span>${esc(p.source)}<br>${external(p.source_url)}</span></div><p style="margin-top:20px">采集 / 导入时间：${esc(p.collected_at)}</p>`,button('查看评论','product-reviews','chat','',`data-id="${esc(p.id)}"`)+button('关闭','close','','primary'));break}
case'product-reviews':{const rows=state.project.reviews.filter(r=>r.product_id===el.dataset.id);modal('对应商品评论',rows.map(reviewBlock).join('')||'<p>暂无评论正文，请先导入。</p>',button('导入评论','import','upload','','data-kind="reviews"'));break}
case'compare':{const rows=state.project.products.filter(x=>x.candidate);modal('候选商品并排比较',`<p>仅比较已有字段。价格以原币种展示，不跨币种或销售口径排名。</p><div class="table-wrap"><table class="compare-table"><thead><tr><th>比较项</th>${rows.map(x=>`<th>${art(x)}<p>${esc(x.title)}</p></th>`).join('')}</tr></thead><tbody>${[['价格',x=>money(x)],['商品特点',x=>x.features.map(esc).join('<br>')||'暂无数据'],['评分',x=>x.rating??'暂无数据'],['评论总数',x=>x.review_count??'暂无数据'],['已有评论样本',x=>state.project.reviews.filter(r=>r.product_id===x.id).length],['销售表现',x=>esc(x.sales_raw||'暂无数据')+'<p>'+esc(x.sales_period)+'</p>'],['来源',x=>source(x)+'<p>'+external(x.source_url)+'</p>'],['待补证据',x=>'成本、物流、退货、实际性能测试']].map(([label,fn])=>`<tr><td>${label}</td>${rows.map(x=>`<td>${fn(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,button('关闭','close')+button('进入选品判断','compare-report','arrow','primary'),true);break}
case'compare-report':closeModal();goto('report');break;
case'analyze':el.disabled=true;try{await mutate('analyze');state.evidenceIds=null;render();toast('已保存规则整理结果，可展开查看证据')}finally{el.disabled=false}break;
case'evidence':state.evidenceIds=latest().insights[Number(el.dataset.index)].evidence_ids;render();break;
case'all-reviews':modal('全部评论样本',state.project.reviews.map(reviewBlock).join('')||'<p>暂无评论正文。</p>',button('关闭','close'),true);break;
case'decision-evidence':{const d=latest().decisions.find(d=>d.product_id===el.dataset.id);modal('判断依据 · 评论原文',state.project.reviews.filter(r=>d.evidence_ids.includes(r.id)).map(reviewBlock).join('')||'<p>尚无对应评论，当前建议是补充证据后继续观察。</p>',button('关闭','close'));break}
case'report-tab':state.reportTab=el.dataset.value;render();break;
case'marketing':state.marketingId=el.dataset.id;state.reportTab='marketing';render();break;
case'copy-marketing':{const p=state.project.products.find(p=>p.id===state.marketingId&&p.candidate)||state.project.products.find(p=>p.candidate);const m=marketing(p);const text=`模板草稿（非 AI 生成，发布前需核验）\n${p.title}\n${m.features.join('\n')}\n${m.opening}\n${m.openingZh}\n${m.example}\n${m.exampleZh}`;try{await navigator.clipboard.writeText(text);toast('营销草稿已复制')}catch{download('marketing-draft.txt',text,'text/plain');toast('剪贴板不可用，已下载草稿')}break}
case'export-project':download('fieldwork-project.json',JSON.stringify(state.project,null,2));toast('完整项目文件已导出');break;
case'export-report':download('research-report.html',fullReportHtml(),'text/html');toast('报告已导出，可独立打开并打印为 PDF');break;
case'restore':modal('恢复项目文件','<p>选择本工作台导出的 JSON 项目包。恢复会创建独立副本，不覆盖已有项目。</p><div class="upload"><input type="file" id="restore-file" accept=".json" aria-label="选择项目文件"></div>',button('取消','close')+button('恢复为新项目','perform-restore','upload','primary'));break;
case'perform-restore':{const file=document.querySelector('#restore-file').files[0];if(!file)throw Error('请选择项目文件');if(file.size>10_000_000)throw Error('项目文件超过 10 MB');const project=JSON.parse(await file.text());state.project=await api('/api/restore',{project});closeModal();goto('overview');toast('已恢复为独立项目');break}
case'rename':modal('项目设置',`<div class="field"><label for="rename-input">项目名称</label><input id="rename-input" value="${esc(state.project.name)}" maxlength="120"></div><p>市场、平台与关键词已关联现有资料。如需更换调研方向，请新建项目。</p>`,button('取消','close')+button('保存','perform-rename','','primary'));break;
case'perform-rename':await mutate('rename',{name:document.querySelector('#rename-input').value});closeModal();toast('项目名称已保存');break;
case'run':showRun(state.project.runs.find(r=>r.id===el.dataset.id));break;
}}
function showRun(r){modal('导入任务详情',`<p>${date(r.created_at)} · 用户导入 · 不适用分页</p><div class="code">请求行数：${r.requested}\n成功新增：${r.imported}\n重复跳过：${r.duplicates}\n失败行数：${r.errors.length}\n停止原因：文件处理完成${r.errors.length?'，存在错误行':''}</div>${r.errors.length?'<h3 style="margin-top:22px">需要修正的行</h3>'+r.errors.slice(0,80).map(e=>`<p class="error-inline">第 ${e.row} 行：${esc(e.reason)}</p>`).join(''):''}`,button('关闭','close'))}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(el.tagName==='A')event.preventDefault();try{await runAction(el.dataset.action,el)}catch(error){const inline=document.querySelector('#modal-error');if(inline)inline.textContent=error.message;else toast(error.message)}});
let searchUpdateTimer;
function updateSearchInput(input){clearTimeout(searchUpdateTimer);if(state.composing)return;const value=input.value,pos=input.selectionStart;searchUpdateTimer=setTimeout(()=>{if(state.composing||!input.isConnected)return;state.query=value;render();const next=document.querySelector('#search-input');if(next){next.focus();next.setSelectionRange(pos,pos)}},150)}
document.addEventListener('compositionstart',()=>{state.composing=true;clearTimeout(searchUpdateTimer)});
document.addEventListener('compositionend',event=>{state.composing=false;if(event.target.id==='search-input')updateSearchInput(event.target)});
document.addEventListener('input',event=>{if(event.target.id==='search-input'&&!event.isComposing&&!state.composing)updateSearchInput(event.target)});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='filter-select'){state.filter=el.value;render()}if(el.id==='sort-select'){state.sort=el.value;render()}if(el.id==='marketing-select'){state.marketingId=el.value;render()}if(el.dataset.select){el.checked?state.selected.add(el.dataset.select):state.selected.delete(el.dataset.select);render()}if(el.id==='select-all'){document.querySelectorAll('[data-select]').forEach(x=>el.checked?state.selected.add(x.dataset.select):state.selected.delete(x.dataset.select));render()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Tab'&&state.modal){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal textarea,.modal select,.modal a')];const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){last?.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first?.focus();event.preventDefault()}}});
window.addEventListener('hashchange',async()=>{const hash=location.hash,[page,search]=hash.slice(1).split('?');const id=new URLSearchParams(search||'').get('project');state.page=routePage(page);const expectedHash=state.page+(id?'?project='+id:'');try{if(id&&id!==state.project?.id&&await openProject(id)===false)return;if(location.hash!==hash&&location.hash.replace(/^#/,'')!==expectedHash)return;state.page=routePage(page);render();if(typeof recommendationsOnNavigation==='function')recommendationsOnNavigation()}catch(error){if(location.hash===hash)toast(error.message)}});
async function init(){const sequence=++projectLoadSequence;try{const projects=await api('/api/projects');if(sequence!==projectLoadSequence)return;state.projects=projects;const [page,search]=location.hash.slice(1).split('?');state.page=routePage(page);const id=new URLSearchParams(search||'').get('project');if(id){const project=await api('/api/projects/'+id);if(sequence!==projectLoadSequence)return;state.project=project;syncQuickProject();}state.page=routePage(page);render();await resumeCollection();if(sequence!==projectLoadSequence)return;await resumeAI();if(sequence!==projectLoadSequence)return;if(typeof recommendationsOnNavigation==='function')recommendationsOnNavigation({afterAI:true});setTimeout(checkDeviceSetup,1200)}catch(error){if(sequence===projectLoadSequence)document.querySelector('#content').innerHTML=empty('工作空间暂不可用',esc(error.message),button('重试','projects','refresh'))}}
init();
</script>
</body></html>
